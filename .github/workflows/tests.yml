name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version used for development (see requirements.txt)
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # On Linux, the PyPI torch wheel pulls in the CUDA build plus several GB of
      # nvidia-* packages. The tests never touch the model, so install the CPU
      # build first; the pinned torch==2.9.0 in requirements.txt is then satisfied.
      - name: Install CPU-only torch
        run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
